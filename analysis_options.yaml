# Static analysis config for Heads Up.
#
# Run with `flutter analyze`. CI should treat any issue as a failure.
#
# The project is small and deadline-bound, so the rule here is: keep the
# analyzer strict, keep the code boring. Anything that trips a lint gets
# fixed or explicitly justified — not switched off wholesale.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A missing return or a dead null check is a real bug in a pipeline that
    # decides whether the friend sees an email at all. Fail the build on it.
    missing_return: error
    dead_code: error
    unused_local_variable: warning

linter:
  rules:
    # Correctness
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_empty_else
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - collection_methods_unrelated_type
    - control_flow_in_finally
    - discarded_futures
    - empty_statements
    - hash_and_equals
    - implicit_reopen
    - invalid_case_patterns
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements
    - unrelated_type_equality_checks
    - use_build_context_synchronously
    - valid_regexps

    # Style / readability
    - always_use_package_imports
    - avoid_positional_boolean_parameters
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas

    # Note: `sort_constructors_first` is deliberately NOT enabled. It would
    # force `MailItem.fromMap` away from `toMap`, splitting a serialization
    # pair that reads better together. Effective Dart treats constructor
    # placement as a readability choice.

    # Note: `public_member_api_docs` is deliberately NOT enabled. Per-field
    # doc comments on a small app cost more than they clarify. Instead each
    # public type carries a class-level comment naming the spec section it
    # implements (architecture.md §5.1, rules.md §6, prd.md §6.4, ...).